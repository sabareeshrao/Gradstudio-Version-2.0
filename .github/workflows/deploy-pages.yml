name: Publish Gradstudio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout organized Gradstudio repository
        uses: actions/checkout@v4
      - name: Set up Node.js for option-quality checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every hosted lesson link and bypass stale module indexes
        run: node study-engine/verify-direct-lesson-links.mjs
      - name: Reject answer-length bias in all study modules
        run: node study-engine/verify-module-options.mjs
      - name: Reject overloaded or missing beginner explanations
        run: node study-engine/verify-explanation-quality.mjs
      - name: Reject generic or repeated diagrams in new study modules
        run: node study-engine/verify-diagram-quality.mjs
      - name: Reject overlapping Attention Mechanism SVG labels
        run: node study-engine/verify-svg-text-layout.mjs attention-mechanism
      - name: Reject NLP Question 3 overlapping SVG labels
        run: node study-engine/verify-svg-text-layout.mjs natural-language-processing Q3
      - name: Reject GAN SVG text collisions and out-of-bounds labels
        run: node study-engine/verify-svg-text-layout.mjs generative-adversarial-network
      - name: Reject Softmax SVG text overlap and out-of-bounds labels
        run: node study-engine/verify-svg-text-layout.mjs softmax
      - name: Check Query Projection SVG text layout
        run: node study-engine/verify-svg-text-layout.mjs query-projection
      - name: Verify Transformer Encoder SVG text layout
        run: node study-engine/verify-svg-text-layout.mjs transformer-encoder
      - name: Verify Next-Token Prediction diagram text and boundaries
        run: node study-engine/verify-svg-text-layout.mjs next-token-prediction
      - name: Verify CNN SVG label layout and viewBox boundaries
        run: node study-engine/verify-svg-text-layout.mjs convolutional-neural-network
      - name: Verify Decision Tree Classifier SVG text layout
        run: node study-engine/verify-svg-text-layout.mjs decision-tree-classifier
      - name: Preserve English diagrams and modern Telugu-English study copy
        run: node "Telugu Translation/verify-translation.mjs"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build website and preserve existing browser links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html lab-v3.css lab-v3.js _site/
          cp -R lessons _site/lessons
          cp -R templates _site/templates
          cp -R archive _site/archive
          cp -R study-engine _site/study-engine
          cp -R "Telugu Translation" "_site/Telugu Translation"

          # Historical root preview URLs continue to serve COMPLETE HTML.
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "_site/$name" ]]; then
              echo "Filename collision in Pages output: $name" >&2
              exit 1
            fi
            cp "$file" "_site/$name"
          done < <(find lessons templates archive -type f -name '*.html' -print0)

          # Preserve historical nested lesson URLs after moving standalone
          # sources from lessons/ to archive/legacy-lessons/.
          node study-engine/build-legacy-aliases.mjs _site
          test -s _site/lessons/latest.html
          test -s _site/lessons/01-transformer.html
          test -s _site/lessons/llm-foundations/Large-Language-Models-LLMs-Keyword-Study-008.html

          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/study-engine/index.html
          test -s "_site/Telugu Translation/01-transformer.html"
          test -s "_site/Telugu Translation/transformer.te.json"
          test -s "_site/Telugu Translation/app-te.js"
          test -s "_site/Telugu Translation/quiz-te.js"
          test -s _site/study-engine/modules/positional-encoding.json
          test -s _site/Large-Language-Models-LLMs-Keyword-Study-008.html
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
