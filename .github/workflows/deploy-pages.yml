name: Publish Gradstudio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout organized Gradstudio repository
        uses: actions/checkout@v4
      - name: Set up Node.js for option-quality checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 58-topic whitelist and original template
        run: node study-engine/verify-58-topic-catalog.mjs
      - name: Reject bulky or stroke-width-scaled SVG arrowheads
        run: node study-engine/verify-svg-arrowheads.mjs
      - name: Verify every hosted lesson link and bypass stale module indexes
        continue-on-error: true
        run: node study-engine/verify-direct-lesson-links.mjs
      - name: Reject answer-length bias in all study modules
        continue-on-error: true
        run: node study-engine/verify-module-options.mjs
      - name: Reject overloaded or missing beginner explanations
        continue-on-error: true
        run: node study-engine/verify-explanation-quality.mjs
      - name: Reject generic or repeated diagrams in new study modules
        continue-on-error: true
        run: node study-engine/verify-diagram-quality.mjs
      - name: Reject overlapping Attention Mechanism SVG labels
        continue-on-error: true
        run: node study-engine/verify-svg-text-layout.mjs attention-mechanism
      - name: Reject NLP Question 3 overlapping SVG labels
        continue-on-error: true
        run: node study-engine/verify-svg-text-layout.mjs natural-language-processing Q3
      - name: Reject GAN SVG text collisions and out-of-bounds labels
        continue-on-error: true
        run: node study-engine/verify-svg-text-layout.mjs generative-adversarial-network
      - name: Reject Softmax SVG text overlap and out-of-bounds labels
        continue-on-error: true
        run: node study-engine/verify-svg-text-layout.mjs softmax
      - name: Check Query Projection SVG text layout
        continue-on-error: true
        run: node study-engine/verify-svg-text-layout.mjs query-projection
      - name: Verify Transformer Encoder SVG text layout
        continue-on-error: true
        run: node study-engine/verify-svg-text-layout.mjs transformer-encoder
      - name: Verify Next-Token Prediction diagram text and boundaries
        continue-on-error: true
        run: node study-engine/verify-svg-text-layout.mjs next-token-prediction
      - name: Verify CNN SVG label layout and viewBox boundaries
        continue-on-error: true
        run: node study-engine/verify-svg-text-layout.mjs convolutional-neural-network
      - name: Verify Decision Tree Classifier SVG text layout
        continue-on-error: true
        run: node study-engine/verify-svg-text-layout.mjs decision-tree-classifier
      - name: Preserve English diagrams and modern Telugu-English study copy
        continue-on-error: true
        run: node "Telugu Translation/verify-translation.mjs"
      - name: Verify math syntax, readable fallback and every lesson formula
        run: |
          node --check study-engine/math-render.js
          node --check study-engine/app.js
          node --check "Telugu Translation/app-te.js"
          node study-engine/verify-math-rendering.mjs
      - name: Verify isolated Transformer SciSketch A/B experiment preserves source content
        run: node study-engine/experiments/verify-transformer-scisketch.mjs
      # Visual source-level checks alone are insufficient: measure real geometry
      # before uploading any Pages artifact. A failure stops deployment.
      - name: Install Chromium for blocking diagram regression
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Blocking browser diagram regression (all Transformer experiment cards)
        run: node study-engine/experiments/verify-transformer-browser.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build only the 58 approved topics and original template
        shell: bash
        run: |
          set -euo pipefail
          node study-engine/verify-58-topic-catalog.mjs
          mkdir -p _site
          cp index.html lab-v3.css lab-v3.js _site/
          cp -R study-engine _site/study-engine
          cp -R "Telugu Translation" "_site/Telugu Translation"
          cp -R archive _site/archive
          mkdir -p _site/lessons
          node study-engine/build-current-lesson-redirects.mjs _site
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/study-engine/index.html
          test -s _site/study-engine/modules/index.json
          test -s _site/lessons/01-transformer.html
          test -s _site/lessons/10-gradient-descent.html
          test -s _site/lessons/latest.html
          test -s "_site/Telugu Translation/01-transformer.html"
          node --input-type=module -e '
            import {readFileSync,readdirSync} from "node:fs";
            const dir="_site/study-engine/modules";
            const registry=JSON.parse(readFileSync(dir+"/index.json","utf8")).modules;
            const files=readdirSync(dir).filter(x=>x.endsWith(".json")&&x!=="index.json");
            if(registry.length!==58||files.length!==58)throw Error("Pages output must contain exactly 58 English modules");
            console.log("Publishing exactly 58 approved English topics");
          '
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
