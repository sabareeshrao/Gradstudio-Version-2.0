name: Build history-grounded Spring PetClinic replay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-timestamps-petclinic-ideal.yml'
      - 'github-timestamps/petclinic/scripts/build_dataset.py'
      - 'github-timestamps/petclinic/scripts/generate_commit_table.mjs'
      - 'github-timestamps/petclinic/scripts/build_history.py'
      - 'github-timestamps/petclinic/logical-replay.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-timestamps-petclinic-ideal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Clone official Spring PetClinic source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/spring-projects/spring-petclinic.git "$RUNNER_TEMP/petclinic"
          git -C "$RUNNER_TEMP/petclinic" checkout --detach 500158f732419217507c7656904b8e6aa1bcc0d6
      - name: Generate verified no-deletions source timeline
        shell: bash
        run: |
          set -euo pipefail
          python3 github-timestamps/petclinic/scripts/build_dataset.py "$RUNNER_TEMP/petclinic"
          git diff --check
          test -s github-timestamps/petclinic/data/manifest.json
          test -s github-timestamps/petclinic/data/sources.json
      - name: Attribute every final line to its real upstream Git history
        run: |
          python3 github-timestamps/petclinic/scripts/build_history.py "$RUNNER_TEMP/petclinic"
          test -s github-timestamps/petclinic/data/history-manifest.json
      - name: Audit real commit provenance and generate sorted commit table
        run: |
          node github-timestamps/petclinic/scripts/generate_commit_table.mjs
          test -s github-timestamps/petclinic/COMMIT_TABLE.md
          test -s github-timestamps/petclinic/data/history-commits.json
          test -s github-timestamps/petclinic/FIRST_100_MINUTES.md
          test -s github-timestamps/petclinic/SECOND_100_MINUTES.md
      - name: Publish generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-timestamps/petclinic/data/manifest.json github-timestamps/petclinic/data/sources.json github-timestamps/petclinic/data/history-manifest.json github-timestamps/petclinic/data/history-commits.json github-timestamps/petclinic/COMMIT_TABLE.md github-timestamps/petclinic/FIRST_100_MINUTES.md github-timestamps/petclinic/SECOND_100_MINUTES.md
          if git diff --cached --quiet; then
            echo 'Generated data unchanged'
            exit 0
          fi
          git commit -m 'Publish audited PetClinic upstream Git blame source replay'
          git pull --rebase origin main
          git push origin HEAD:main
