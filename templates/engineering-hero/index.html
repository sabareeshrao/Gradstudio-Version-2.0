<style>
*{box-sizing:border-box} :root{--page:#20211e;--gap:clamp(10px,1.4vw,18px);--row-space:clamp(54px,6.5vw,100px);--ink:#f0eadb}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,.track:focus-visible{outline:2px solid #f2c34d;outline-offset:3px}header{max-width:1440px;margin:auto;height:64px;padding:0 clamp(16px,4vw,52px);display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:750;letter-spacing:-.7px}.back{font-size:13px;color:#c8c4b7}main{max-width:1440px;margin:auto;padding:0 clamp(12px,3vw,36px) 80px}.hero{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:16/9;min-height:215px;border-radius:clamp(14px,2.4vw,30px) clamp(14px,2.4vw,30px) 0 0;background:var(--page)}.hero-art{position:absolute;inset:0;width:100%;height:100%}.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 45%,#20211e0d 62%,#20211eae 86%,var(--page) 100%),linear-gradient(90deg,var(--page),transparent 4%,transparent 96%,var(--page))}.hero-copy{position:absolute;z-index:2;left:7%;top:14%;max-width:56%}.kicker{font-size:clamp(8px,1.2vw,15px);letter-spacing:.15em;font-weight:650;color:#f0c64f;margin:0 0 1.2em}.hero h1{font-size:clamp(28px,6.4vw,90px);letter-spacing:-.075em;line-height:.96;margin:0 0 .24em;font-weight:800}.hero-copy p:last-child{font-size:clamp(12px,1.6vw,21px);line-height:1.4;margin:0;color:#ded8c8;max-width:24em}.catalog{position:relative;z-index:3;margin:clamp(-80px,-5vw,-18px) auto 0;padding:0 clamp(3px,2vw,24px)}.catalog-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 32px}.catalog-head h2{font-size:clamp(24px,3.3vw,42px);letter-spacing:-.05em;margin:0 0 6px}.catalog-head p{margin:0;color:#c4c0b3;font-size:clamp(12px,1.25vw,15px)}.catalog-head a{color:#e6c66d;font-size:12px;white-space:nowrap}.rows{display:flex;flex-direction:column;gap:var(--row-space)}.row{min-width:0;--h:clamp(260px,32vw,385px);--unit:clamp(132px,calc((100vw - 66px)/3),350px)}.row h3{font-size:clamp(18px,2.2vw,30px);font-weight:700;letter-spacing:-.035em;margin:0 0 12px;line-height:1.3}.row h3 span{color:#aaa99d;font-weight:500}.track{display:flex;align-items:stretch;gap:var(--gap);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-left:5px;scrollbar-width:none;padding:7px 5px 21px;margin:0 -5px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.track::-webkit-scrollbar{display:none}.tile{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;border-radius:clamp(13px,1.5vw,23px);overflow:hidden;box-shadow:0 7px 18px #0005;background:var(--tile-bg,#eae0c9);color:var(--tile-fg,#292b25);text-align:left;transition:transform .2s;flex:0 0 auto;scroll-snap-align:start}.tile:hover{transform:translateY(-2px)}.uniform .tile{width:var(--unit);aspect-ratio:.687;align-self:stretch}.tile-copy{padding:clamp(12px,1.6vw,22px);position:relative;z-index:1}.tile-copy small{font-size:clamp(8px,.9vw,12px);font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:7px;opacity:.75}.tile-copy h4{font-size:clamp(15px,2vw,28px);font-weight:730;letter-spacing:-.04em;line-height:1.12;margin:0;overflow-wrap:anywhere}.tile-art{flex:1;min-height:0;display:flex;align-items:center;padding:0 10px 28px}.tile-art img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;border-radius:5px}.open-mark{position:absolute;right:9px;bottom:9px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#ffffffb0;color:#222;font-size:18px}.mixed .tile{height:var(--h);width:calc(var(--h)*.78)}.mixed .tile.wide{width:calc(var(--h)*1.45)}.mixed .tile.wide .tile-art{padding:0 14px 28px}.stack{height:var(--h);width:calc((var(--h) - var(--gap))*.94);display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:var(--gap);flex:0 0 auto;scroll-snap-align:start}.mixed .stack .tile{height:100%;width:100%;display:grid;grid-template-columns:37% 63%;align-items:center}.stack .tile-copy{padding:10px}.stack .tile-copy h4{font-size:clamp(12px,1.6vw,21px)}.stack .tile-copy small{font-size:9px;letter-spacing:0}.stack .tile-art{padding:7px 9px 16px;height:100%}.stack .open-mark{width:17px;height:17px;font-size:14px;bottom:5px;right:5px}.nav{display:flex;justify-content:flex-end;gap:9px}.nav button{border:0;border-radius:50%;background:#ffffff17;color:#eae6da;width:38px;height:38px;display:grid;place-items:center}.nav button:disabled{opacity:.28;cursor:default}.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.status{padding:20px 0;color:#d2cabc}.status[hidden]{display:none}dialog{color:#f1eadc;background:#20211e;border:1px solid #5b5a51;border-radius:14px;width:min(94vw,1120px);max-height:92vh;padding:14px}dialog::backdrop{background:#000c}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.toolbar button{background:#383a33;color:white;border:0;border-radius:8px;width:36px;height:36px;font-size:19px}.viewer-scroll{overflow:auto;max-height:73vh}.viewer-scroll img{width:100%;height:auto;max-width:none;display:block}.original{display:inline-block;color:#e6c66d;margin-top:12px;font-size:13px}

<script>
(()=>{const url=new URL('../subject-thumbnails/internet/index.html',location.href),rows=document.getElementById('rows'),status=document.getElementById('status'),dialog=document.getElementById('viewer'),large=document.getElementById('large');let zoom=1,base=640;
const categories=[{name:'Programming languages',sub:'Learn the building blocks.',re:/python|java\b|javascript|typescript|golang|\bgo\b|rust|\bc\+\+|\bc#|kotlin|swift|ruby|php|programming/i},{name:'Web & backend',sub:'Build applications and services.',re:/backend|frontend|web development|spring|rest|jwt|graphql|http|websocket|html|css|react|node|api|microservice|browser/i},{name:'Databases & data',sub:'Store, query and move information.',re:/database|postgres|mysql|\bsql\b|mongodb|redis|data engineer|data analyst|kafka|warehouse|indexing/i},{name:'Cloud & DevOps',sub:'Deploy and operate at scale.',re:/aws|azure|cloud|devops|docker|kubernetes|terraform|jenkins|\bec2\b|\bs3\b|\beks\b|cloudfront|ci\/cd/i},{name:'Systems & security',sub:'Understand the infrastructure.',re:/linux|operating system|cyber|security|network|system design|hardware|cpu|memory|terminal|git/i},{name:'More engineering',sub:'Explore the wider toolkit.',re:/.*/}];
const ai=/artificial intelligence|agentic ai|\bai\b|pytorch|machine learning|tensorflow|scikit.learn|deep learning|\bllm\b|generative ai|natural language processing|computer vision/i;
const palettes=[['#e9dfc9','#292b25'],['#31578a','#f5edda'],['#d9ad3d','#292b25'],['#b94731','#fff4e0'],['#e1d5bb','#292b25'],['#343d39','#f1e8d3']];
function make(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e}
function size(){large.style.width=Math.round(base*zoom)+'px'}document.getElementById('plus').onclick=()=>{zoom=Math.min(3,zoom+.25);size()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.5,zoom-.25);size()};document.getElementById('close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
function card(e,i,wide=false){const a=make('a','tile'+(wide?' wide':''));a.href=e.href;const [bg,fg]=palettes[i%palettes.length];a.style.setProperty('--tile-bg',bg);a.style.setProperty('--tile-fg',fg);a.setAttribute('aria-label',e.title+' — enlarge thumbnail');const copy=make('div','tile-copy');copy.append(make('small','',e.section),make('h4','',e.title));const art=make('div','tile-art'),img=make('img');img.src=e.src;img.alt=e.title;img.loading='lazy';img.decoding='async';art.append(img);a.append(copy,art,make('span','open-mark','›'));a.addEventListener('click',ev=>{if(ev.ctrlKey||ev.metaKey||ev.shiftKey||ev.altKey||!dialog.showModal)return;ev.preventDefault();document.getElementById('viewer-title').textContent=e.title;document.getElementById('original').href=e.href;large.src=e.src;large.alt=e.title;dialog.showModal();base=Math.max(640,dialog.querySelector('.viewer-scroll').clientWidth);zoom=1;size()});return a}
function row(group,index){let uniform=index<2,section=make('section','row '+(uniform?'uniform':'mixed')),heading=make('h3','',group.name+'. ');heading.append(make('span','',group.sub));heading.id='heading-'+index;section.setAttribute('aria-labelledby',heading.id);const track=make('div','track');track.tabIndex=0;track.id='track-'+index;track.setAttribute('role','region');track.setAttribute('aria-label',group.name+' carousel');let i=0;while(i<group.items.length){if(!uniform&&i%5===1&&i+1<group.items.length){let stack=make('div','stack');stack.append(card(group.items[i],i),card(group.items[i+1],i+1));track.append(stack);i+=2}else{track.append(card(group.items[i],i,!uniform&&i%5===3));i++}}const nav=make('div','nav');const arrows=[-1,1].map(dir=>{let b=make('button');b.type='button';b.setAttribute('aria-label',(dir<0?'Previous ':'Next ')+group.name+' cards');b.setAttribute('aria-controls',track.id);b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+(dir<0?'m15 5-7 7 7 7':'m9 5 7 7-7 7')+'"/></svg>';nav.append(b);return b});const sync=()=>{arrows[0].disabled=track.scrollLeft<=2;arrows[1].disabled=track.scrollLeft+track.clientWidth>=track.scrollWidth-2};function move(dir){let first=track.firstElementChild;if(!first)return;let stops=[...track.children].map(c=>c.offsetLeft-first.offsetLeft),x=track.scrollLeft,max=track.scrollWidth-track.clientWidth;let target=dir>0?(stops.find(v=>v>x+5)??max):([...stops].reverse().find(v=>v<x-5)??0);track.scrollTo({left:Math.max(0,Math.min(max,target)),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}arrows.forEach((b,i)=>b.onclick=()=>move(i===0?-1:1));track.addEventListener('scroll',sync,{passive:true});track.addEventListener('keydown',e=>{if(e.target===track&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();move(e.key==='ArrowRight'?1:-1)}});section.append(heading,track,nav);rows.append(section);if('ResizeObserver'in window)new ResizeObserver(sync).observe(track);requestAnimationFrame(sync)}
fetch(url.href).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html'),serializer=new XMLSerializer(),groups=categories.map(c=>({...c,items:[]}));let total=0;for(const sec of doc.querySelectorAll('section.samples')){const label=sec.getAttribute('aria-label')||'Engineering';if(ai.test(label))continue;const heading=sec.previousElementSibling;const anchor=heading?.id||sec.id||'';const target=new URL(url.href);target.hash=anchor;const group=groups.find(g=>g.re.test(label));for(const figure of sec.querySelectorAll('figure')){const original=figure.querySelector('svg');if(!original)continue;const svg=original.cloneNode(true);if(!svg.hasAttribute('xmlns'))svg.setAttributeNS('http://www.w3.org/2000/xmlns/','xmlns','http://www.w3.org/2000/svg');const raw=original.getAttribute('aria-label')||figure.querySelector('figcaption')?.textContent?.trim()||label;const title=raw.replace(/^\s*\d+\s*[—–.\-:]\s*/,'').split(' · ')[0].trim();const src=URL.createObjectURL(new Blob([serializer.serializeToString(svg)],{type:'image/svg+xml'}));group.items.push({title,section:label.replace(/\s*[—–·].*$/,'').slice(0,44),src,href:target.href});total++}}
if(!total)throw Error('No engineering thumbnails found');groups.filter(g=>g.items.length).forEach(row);document.getElementById('count').textContent=total+' existing thumbnails · '+groups.filter(g=>g.items.length).length+' collections';status.hidden=true}).catch(err=>{status.textContent='The thumbnail catalog could not be loaded. Open the original catalog above.';console.warn(err)});
})();
