<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="da-h-title da-h-desc"><title id="da-h-title">A bicycle photo yields several valid training views</title><desc id="da-h-desc">Original bicycle image transformed to different exposures and viewpoints; label stays bicycle, and the model learns useful variation.</desc><defs><marker id="da-h-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#438d9b" stroke-width="1.6"/></marker></defs><rect x="2" y="2" width="996" height="426" rx="19" fill="#f8fcfd" stroke="#d6e6eb"/><text x="38" y="41" text-anchor="start" font-size="14" fill="#328574" font-weight="850" font-family="system-ui">DATA AUGMENTATION · THE BIG PICTURE</text><text x="38" y="79" text-anchor="start" font-size="27" fill="#2c5268" font-weight="850" font-family="system-ui">One real photo. Many helpful training views.</text><rect x="42" y="116" width="254" height="239" rx="13" fill="#fff" stroke="#d6e6eb"/><text x="169" y="146" text-anchor="middle" font-size="13" fill="#588196" font-weight="850" font-family="system-ui">ORIGINAL IMAGE</text><svg x="66" y="165" width="206" height="148" viewBox="0 0 160 115"><rect x="0" y="0" width="160" height="115" rx="9" fill="#d7f2f9"/><circle cx="133" cy="24" r="15" fill="#ffdc9a"/><path d="M0 73 L32 28 L57 65 L84 35 L160 77 L160 115 L0 115" fill="#abc8c2" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><path d="M0 85 L43 54 L72 72 L121 47 L160 86 L160 115 L0 115" fill="#78ae9c" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><path d="M0 103 Q86 87 160 103 L160 115 L0 115" fill="#ccb998" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><g ><g transform="translate(22 47) scale(0.85)"><circle cx="12" cy="47" r="15" fill="none" stroke="#33566b" stroke-width="3"/><circle cx="70" cy="47" r="15" fill="none" stroke="#33566b" stroke-width="3"/>