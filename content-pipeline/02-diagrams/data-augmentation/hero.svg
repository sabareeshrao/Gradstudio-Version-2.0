="#438d9b" stroke-width="3" marker-end="url(#da-h-arrow)"/><rect x="706" y="149" width="246" height="176" rx="13" fill="#eaf7f4" stroke="#d6e6eb"/><text x="829" y="177" text-anchor="middle" font-size="16" fill="#2e786e" font-weight="850" font-family="system-ui">TRAIN MODEL</text><rect x="730" y="197" width="27" height="68" rx="8" fill="#75b5ca" stroke="#d6e6eb"/><rect x="769" y="197" width="27" height="68" rx="8" fill="#e4a070" stroke="#d6e6eb"/><rect x="808" y="197" width="27" height="68" rx="8" fill="#7cb5a1" stroke="#d6e6eb"/><rect x="847" y="197" width="27" height="68" rx="8" fill="#a2a3d4" stroke="#d6e6eb"/><rect x="886" y="197" width="27" height="68" rx="8" fill="#e7c37c" stroke="#d6e6eb"/><text x="829" y="293" text-anchor="middle" font-size="13" fill="#3a6377" font-weight="700" font-family="system-ui">Can generalize better</text><text x="44" y="398" text-anchor="start" font-size="13" fill="#607b88" font-weight="500" font-family="system-ui">*Transformations must preserve the task label. Evaluation images remain independent.</text></svg>