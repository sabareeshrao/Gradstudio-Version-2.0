<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="da-6-title da-6-desc"><title id="da-6-title">Mixup, CutMix, and generative synthetic augmentation</title><desc id="da-6-desc">Mixup interpolates two examples and soft labels, CutMix pastes one image region over another with area-weighted labels, and synthetic generators produce additional realistic examples.</desc><defs><marker id="da-6-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" stroke="#4b8fa1" fill="none" stroke-width="1.7"/></marker></defs><rect x="2" y="2" width="996" height="426" rx="19" fill="#f9fcfd" stroke="#d6e6eb"/><text x="40" y="41" fill="#298576" font-size="13" font-family="system-ui" font-weight="900" text-anchor="start">06 · ADVANCED AUGMENTATION</text><text x="40" y="75" fill="#2c5369" font-size="25" font-family="system-ui" font-weight="850" text-anchor="start">Three different ways to extend a dataset</text><rect x="32" y="106" width="300" height="269" rx="13" fill="#fff" stroke="#d6e6eb"/><rect x="350" y="106" width="300" height="269" rx="13" fill="#fff" stroke="#d6e6eb"/><rect x="668" y="106" width="300" height="269" rx="13" fill="#fff" stroke="#d6e6eb"/><text x="55" y="137" fill="#36738d" font-size="18" font-family="system-ui" font-weight="900" text-anchor="start">MIXUP</text><circle cx="98" cy="204" r="38" fill="#73b2d1"/><text x="98" y="214" fill="#fff" font-size="25" font-family="system-ui" font-weight="900" text-anchor="middle">A</text><text x="183" y="213" fill="#608494" font-size="28" font-family="system-ui" font-weight="750" text-anchor="middle">+</text><circle cx="263" cy="204" r="38" fill="#eaa66c"/><text x="263" y="214" fill="#fff" font-size="25" font-family="system-ui" font-weight="900" text-anchor="middle">B</text><rect x="105" y="272" width="161" height="14" rx="7" fill="#eba96d" stroke="#d6e6eb"/><rect x="105" y="272" width="113" height="14" rx="7" fill="#539cc4" stroke="#d6e6eb"/><text x="183" y="316" fill="#4a7186" font-size="14" font-family="system-ui" font-weight="800" text-anchor="middle">0.7 × A + 0.3 × B</text><text x="183" y="341" fill="#2c8976" font-size="12" font-family="system-ui" font-weight="800" text-anchor="middle">soft label [0.7, 0.3]</text><text x="371" y="137" fill="#36738d" font-size="18" font-family="system-ui" font-weight="900" text-anchor="start">CUTMIX</text><rect x="369" y="165" width="113" height="128" rx="11" fill="#b1d5df" stroke="#d6e6eb"/><rect x="496" y="165" width="129" height="128" rx="11" fill="#e3d7af" stroke="#d6e6eb"/><path d="M371 262 L403 219 L428 244 L463 207 L481 250" fill="none" stroke="#4c879a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M498 267 L538 203 L570 239 L612 203" fill="none" stroke="#a78e6e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="230" width="46" height="44" rx="3" fill="#e4bd83" stroke="#d6e6eb"/><path d="M484 229 L493 229" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-6-arrow)"/><text x="502" y="317" fill="#4a7186" font-size="13" font-family="system-ui" font-weight="800" text-anchor="middle">Swap image patch</text><text x="502" y="342" fill="#2c8976" font-size="12" font-family="system-ui" font-weight="800" text-anchor="middle">mix labels by patch area</text><text x="691" y="137" fill="#36738d" font-size="17" font-family="system-ui" font-weight="900" text-anchor="start">GENERATED SAMPLES</text><rect x="698" y="165" width="69" height="83" rx="10" fill="#e9f5f8" stroke="#d6e6eb"/><circle cx="734" cy="205" r="18" fill="#82b8c9"/><rect x="783" y="165" width="69" height="83" rx="10" fill="#f1edfa" stroke="#d6e6eb"/><circle cx="819" cy="205" r="18" fill="#ae9dc7"/><rect x="868" y="165" width="69" height="83" rx="10" fill="#e9f6eb" stroke="#d6e6eb"/><circle cx="904" cy="205" r="18" fill="#88bca2"/><path d="M704 291 Q760 259 811 280 T940 275" fill="none" stroke="#4a9baa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="814" y="335" fill="#2c8976" font-size="13" font-family="system-ui" font-weight="800" text-anchor="middle">Verify realism &amp; labels</text><text x="40" y="401" fill="#617b89" font-size="13" font-family="system-ui" font-weight="500" text-anchor="start">Mixed inputs need mixed targets; generated examples still require quality control.</text></svg>