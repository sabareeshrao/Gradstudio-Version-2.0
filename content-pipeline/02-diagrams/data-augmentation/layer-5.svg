<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="da-5-title da-5-desc"><title id="da-5-title">Safe transformations versus label corruption</title><desc id="da-5-desc">A small shift of handwritten digit 6 preserves its correct label; a 180-degree rotation may look like 9, invalidating the original label for digit recognition.</desc><defs><marker id="da-5-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" stroke="#4b8fa1" fill="none" stroke-width="1.7"/></marker></defs><rect x="2" y="2" width="996" height="426" rx="19" fill="#fafcfd" stroke="#d6e6eb"/><text x="41" y="41" fill="#298576" font-size="13" font-family="system-ui" font-weight="900" text-anchor="start">05 · LABEL CORRECTNESS</text><text x="41" y="75" fill="#2c5369" font-size="25" font-family="system-ui" font-weight="850" text-anchor="start">Does the transformation change the answer?</text><rect x="40" y="110" width="439" height="256" rx="17" fill="#f3fbf7" stroke="#d6e6eb"/><rect x="521" y="110" width="439" height="256" rx="17" fill="#fff7f5" stroke="#d6e6eb"/><text x="61" y="141" fill="#298267" font-size="16" font-family="system-ui" font-weight="900" text-anchor="start">SAFE SHIFT</text><text x="542" y="141" fill="#b76857" font-size="16" font-family="system-ui" font-weight="900" text-anchor="start">UNSAFE HALF-TURN</text><rect x="81" y="174" width="116" height="123" rx="13" fill="#fff" stroke="#d6e6eb"/><text x="139" y="270" fill="#355d7d" font-size="98" font-family="system-ui" font-weight="850" text-anchor="middle">6</text><path d="M208 237 L274 237" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-5-arrow)"/><rect x="295" y="174" width="116" height="123" rx="13" fill="#fff" stroke="#d6e6eb"/><text x="353" y="270" fill="#355d7d" font-size="98" font-family="system-ui" font-weight="850" text-anchor="middle">6</text><rect x="562" y="174" width="116" height="123" rx="13" fill="#fff" stroke="#d6e6eb"/><text x="620" y="270" fill="#355d7d" font-size="98" font-family="system-ui" font-weight="850" text-anchor="middle">6</text><path d="M692 237 L761 237" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-5-arrow)"/><rect x="780" y="174" width="116" height="123" rx="13" fill="#fff" stroke="#d6e6eb"/><g transform="rotate(180 838 238)"><text x="838" y="269" fill="#355d7d" font-size="98" font-family="system-ui" font-weight="850" text-anchor="middle">6</text></g><text x="261" y="340" fill="#26806c" font-size="14" font-family="system-ui" font-weight="800" text-anchor="middle">✓ Still digit 6</text><text x="744" y="340" fill="#b86455" font-size="14" font-family="system-ui" font-weight="800" text-anchor="middle">× Might resemble digit 9</text><text x="42" y="400" fill="#617c8b" font-size="13" font-family="system-ui" font-weight="500" text-anchor="start">Task labels determine which transformations are safe. More variation is not always better.</text></svg>