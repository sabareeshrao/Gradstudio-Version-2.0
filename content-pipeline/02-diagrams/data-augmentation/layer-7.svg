<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="da-7-title da-7-desc"><title id="da-7-title">Data augmentation optimization with leakage-free evaluation</title><desc id="da-7-desc">A split-first scheme isolates augmentation on training data; held-out validation and test are left untouched while label validity, group isolation, realism and distribution match are checked.</desc><defs><marker id="da-7-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" stroke="#4b8fa1" fill="none" stroke-width="1.7"/></marker></defs><rect x="2" y="2" width="996" height="426" rx="19" fill="#f9fcfd" stroke="#d6e6eb"/><text x="39" y="42" fill="#298576" font-size="13" font-family="system-ui" font-weight="900" text-anchor="start">07 · HONEST EVALUATION</text><text x="39" y="75" fill="#2c5369" font-size="24" font-family="system-ui" font-weight="850" text-anchor="start">Improve the model without leaking answers</text><rect x="37" y="105" width="591" height="263" rx="13" fill="#fff" stroke="#d6e6eb"/><rect x="646" y="105" width="317" height="263" rx="13" fill="#fff" stroke="#d6e6eb"/><text x="56" y="136" fill="#36738d" font-size="14" font-family="system-ui" font-weight="850" text-anchor="start">SPLIT FIRST, THEN AUGMENT ONLY TRAINING</text><rect x="60" y="162" width="234" height="116" rx="13" fill="#e9f8ef" stroke="#d6e6eb"/><rect x="377" y="162" width="223" height="116" rx="13" fill="#f0f6fa" stroke="#d6e6eb"/><text x="177" y="188" fill="#297d64" font-size="17" font-family="system-ui" font-weight="900" text-anchor="middle">TRAINING</text><text x="177" y="217" fill="#447864" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">fit transform policy</text><text x="177" y="246" fill="#447864" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">make augmented copies</text><text x="489" y="188" fill="#40718c" font-size="17" font-family="system-ui" font-weight="900" text-anchor="middle">HOLDOUT</text><text x="489" y="217" fill="#5a7c8f" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">no training updates</text><text x="489" y="246" fill="#5a7c8f" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">evaluate untouched</text><path d="M317 166 L361 268 M361 166 L317 268" fill="none" stroke="#d36c61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="339" y="296" fill="#b96354" font-size="12" font-family="system-ui" font-weight="850" text-anchor="middle">NO CROSS-SPLIT COPYING</text><text x="62" y="350" fill="#5d7b8b" font-size="12" font-family="system-ui" font-weight="670" text-anchor="start">Tune on validation; evaluate the final test separately.</text><text x="670" y="135" fill="#36738d" font-size="14" font-family="system-ui" font-weight="850" text-anchor="start">QUALITY CHECKS</text><circle cx="675" cy="171" r="11" fill="#339b7c"/><text x="675" y="176" fill="#fff" font-size="13" font-family="system-ui" font-weight="900" text-anchor="middle">✓</text><text x="696" y="176" fill="#436b7b" font-size="12" font-family="system-ui" font-weight="700" text-anchor="start">Labels remain correct</text><circle cx="675" cy="204" r="11" fill="#339b7c"/><text x="675" y="209" fill="#fff" font-size="13" font-family="system-ui" font-weight="900" text-anchor="middle">✓</text><text x="696" y="209" fill="#436b7b" font-size="12" font-family="system-ui" font-weight="700" text-anchor="start">No shared identities</text><circle cx="675" cy="237" r="11" fill="#339b7c"/><text x="675" y="242" fill="#fff" font-size="13" font-family="system-ui" font-weight="900" text-anchor="middle">✓</text><text x="696" y="242" fill="#436b7b" font-size="12" font-family="system-ui" font-weight="700" text-anchor="start">Variations are realistic</text><circle cx="675" cy="270" r="11" fill="#339b7c"/><text x="675" y="275" fill="#fff" font-size="13" font-family="system-ui" font-weight="900" text-anchor="middle">✓</text><text x="696" y="275" fill="#436b7b" font-size="12" font-family="system-ui" font-weight="700" text-anchor="start">Match deployment conditions</text><text x="670" y="327" fill="#607d8b" font-size="12" font-family="system-ui" font-weight="690" text-anchor="start">Compare performance by group</text><text x="39" y="401" fill="#617b89" font-size="13" font-family="system-ui" font-weight="500" text-anchor="start">Reject unrealistic transformations and keep augmented versions out of held-out evaluation.</text></svg>