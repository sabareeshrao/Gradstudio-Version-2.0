<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="da-3-title da-3-desc"><title id="da-3-title">Image, text and audio augmentation compared</title><desc id="da-3-desc">Exposure shift, meaning-preserving paraphrase and audio waveform changes. Labels are checked for validity in every medium.</desc><defs><marker id="da-3-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" stroke="#4b8fa1" fill="none" stroke-width="1.7"/></marker></defs><rect x="2" y="2" width="996" height="426" rx="19" fill="#f9fcfd" stroke="#d6e6eb"/><text x="40" y="42" fill="#298476" font-size="13" font-family="system-ui" font-weight="900" text-anchor="start">03 · MEDIA-SPECIFIC AUGMENTATION</text><text x="40" y="78" fill="#2d5168" font-size="24" font-family="system-ui" font-weight="850" text-anchor="start">Different inputs require different safe changes</text><rect x="37" y="107" width="290" height="265" rx="13" fill="#fff" stroke="#d6e6eb"/><rect x="354" y="107" width="290" height="265" rx="13" fill="#fff" stroke="#d6e6eb"/><rect x="671" y="107" width="290" height="265" rx="13" fill="#fff" stroke="#d6e6eb"/><text x="59" y="138" fill="#3d7c92" font-size="16" font-family="system-ui" font-weight="850" text-anchor="start">IMAGE</text><text x="378" y="138" fill="#7f73aa" font-size="16" font-family="system-ui" font-weight="850" text-anchor="start">TEXT</text><text x="695" y="138" fill="#36927c" font-size="16" font-family="system-ui" font-weight="850" text-anchor="start">AUDIO</text><svg x="61" y="166" width="111" height="105" viewBox="0 0 111 105"><rect width="111" height="105" rx="9" fill="#dceef6"/><circle cx="81" cy="25" r="12" fill="#f9cf8b"/><path d="M0 85 L35 38 L61 70 L80 52 L111 81 L111 105 L0 105 Z" fill="#7aafaa"/><path d="M0 92 Q55 72 111 97 L111 105 L0 105 Z" fill="#d1bd91"/></svg><svg x="194" y="166" width="111" height="105" viewBox="0 0 111 105"><rect width="111" height="105" rx="9" fill="#cde2e6"/><circle cx="81" cy="25" r="12" fill="#f9cf8b"/><path d="M0 85 L35 38 L61 70 L80 52 L111 81 L111 105 L0 105 Z" fill="#7aafaa"/><path d="M0 92 Q55 72 111 97 L111 105 L0 105 Z" fill="#d1bd91"/></svg><path d="M174 218 L191 218" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-3-arrow)"/><text x="183" y="315" fill="#597889" font-size="12" font-family="system-ui" font-weight="680" text-anchor="middle">crop · brightness · rotate</text><rect x="375" y="169" width="248" height="50" rx="13" fill="#eaf2fe" stroke="#d6e6eb"/><text x="391" y="199" fill="#49657e" font-size="13" font-family="system-ui" font-weight="670" text-anchor="start">The parcel arrived early.</text><path d="M493 223 L493 249" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-3-arrow)"/><rect x="375" y="256" width="248" height="50" rx="13" fill="#eaf9f1" stroke="#d6e6eb"/><text x="391" y="285" fill="#386f67" font-size="13" font-family="system-ui" font-weight="670" text-anchor="start">Delivery came sooner.</text><text x="496" y="339" fill="#4b8071" font-size="12" font-family="system-ui" font-weight="720" text-anchor="middle">Meaning must stay unchanged</text><rect x="692" y="166" width="249" height="123" rx="13" fill="#f7fbfc" stroke="#d6e6eb"/><path d="M706.0 201.0 L708.1 201.7 L710.2 203.4 L712.3 205.4 L714.4 206.8 L716.5 206.8 L718.6 204.7 L720.7 200.9 L722.8 196.0 L724.9 191.3 L727.0 188.0 L729.1 187.2 L731.2 189.4 L733.3 194.4 L735.4 201.3 L737.5 208.5 L739.6 214.4 L741.7 217.6 L743.8 217.5 L745.9 213.9 L748.0 207.8 L750.1 200.6 L752.2 193.9 L754.3 189.1 L756.4 187.1 L758.5 188.2 L760.6 191.7 L762.7 196.5 L764.8 201.3 L766.9 205.0 L769.0 206.8 L771.1 206.8 L773.2 205.2 L775.3 203.2 L777.4 201.5 L779.5 201.0 L781.6 201.8 L783.7 203.6 L785.8 205.6 L787.9 206.9 L790.0 206.6 L792.1 204.4 L794.2 200.5 L796.3 195.6 L798.4 190.9 L800.5 187.8 L802.6 187.3 L804.7 189.8 L806.8 195.0 L808.9 202.0 L811.0 209.1 L813.1 214.8 L815.2 217.8 L817.3 217.3 L819.4 213.4 L821.5 207.2 L823.6 199