<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="da-4-title da-4-desc"><title id="da-4-title">Online versus offline augmentation timing and storage</title><desc id="da-4-desc">Two process timelines show online transformations inside the training loop versus saved offline transformations made beforehand, with their compute and storage tradeoffs.</desc><defs><marker id="da-4-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" stroke="#4b8fa1" fill="none" stroke-width="1.7"/></marker></defs><rect x="2" y="2" width="996" height="426" rx="19" fill="#fafcfd" stroke="#d6e6eb"/><text x="40" y="41" fill="#298576" font-size="13" font-family="system-ui" font-weight="900" text-anchor="start">04 · ONLINE VERSUS OFFLINE</text><text x="40" y="75" fill="#2c5369" font-size="25" font-family="system-ui" font-weight="850" text-anchor="start">When are new examples generated?</text><rect x="41" y="103" width="916" height="128" rx="16" fill="#f3fbfd" stroke="#d6e6eb"/><text x="62" y="132" fill="#2c7b8e" font-size="16" font-family="system-ui" font-weight="850" text-anchor="start">ONLINE · create views during each training batch</text><rect x="78" y="152" width="142" height="48" rx="11" fill="#e6f4fa" stroke="#d6e6eb"/><text x="149" y="181" fill="#466f83" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">source image</text><path d="M225 177 L279 177" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-4-arrow)"/><rect x="286" y="152" width="142" height="48" rx="11" fill="#e6f4fa" stroke="#d6e6eb"/><text x="357" y="181" fill="#466f83" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">random transform</text><path d="M433 177 L487 177" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-4-arrow)"/><rect x="494" y="152" width="142" height="48" rx="11" fill="#e6f4fa" stroke="#d6e6eb"/><text x="565" y="181" fill="#466f83" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">fresh view</text><path d="M641 177 L695 177" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-4-arrow)"/><rect x="702" y="152" width="142" height="48" rx="11" fill="#def5eb" stroke="#d6e6eb"/><text x="773" y="181" fill="#466f83" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">train now</text><rect x="41" y="247" width="916" height="128" rx="16" fill="#fffaf1" stroke="#d6e6eb"/><text x="62" y="276" fill="#a37747" font-size="16" font-family="system-ui" font-weight="850" text-anchor="start">OFFLINE · generate and save views before training</text><rect x="78" y="296" width="142" height="48" rx="11" fill="#fff0d8" stroke="#d6e6eb"/><text x="149" y="325" fill="#7e6849" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">source image</text><path d="M225 321 L279 321" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-4-arrow)"/><rect x="286" y="296" width="142" height="48" rx="11" fill="#fff0d8" stroke="#d6e6eb"/><text x="357" y="325" fill="#7e6849" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">prepare copies</text><path d="M433 321 L487 321" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-4-arrow)"/><rect x="494" y="296" width="142" height="48" rx="11" fill="#fff0d8" stroke="#d6e6eb"/><text x="565" y="325" fill="#7e6849" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">save to disk</text><path d="M641 321 L695 321" fill="none" stroke="#4b8fa1" stroke-width="2.8" marker-end="url(#da-4-arrow)"/><rect x="702" y="296" width="142" height="48" rx="11" fill="#def5eb" stroke="#d6e6eb"/><text x="773" y="325" fill="#7e6849" font-size="12" font-family="system-ui" font-weight="750" text-anchor="middle">train later</text><text x="41" y="404" fill="#617c8b" font-size="13" font-family="system-ui" font-weight="500" text-anchor="start">Online saves storage for copies; offline reuses saved views. Speed depends on workload.</text></svg>