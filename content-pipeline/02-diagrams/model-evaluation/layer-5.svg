<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="me-5-t me-5-d"><title id="me-5-t">Cross-validation selects without peeking</title><desc id="me-5-d">Rotating colored validation folds, baseline reference and a still-sealed final test set.</desc><defs><linearGradient id="me-5-wash" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ecf7fa"/></linearGradient></defs><rect x="1" y="1" width="998" height="428" rx="20" fill="url(#me-5-wash)" stroke="#d6e5eb"/><text x="34" y="38" font-family="system-ui,sans-serif" font-size="12" fill="#158c80" font-weight="850" text-anchor="start">GRADSTUDIO     •     MODEL EVALUATION</text><text x="34" y="77" font-family="system-ui,sans-serif" font-size="26" fill="#1d4056" font-weight="820" text-anchor="start">05 · Folds, baselines and hyperparameter tuning</text><text x="44" y="119" font-family="system-ui,sans-serif" font-size="15" fill="#5b7889" font-weight="650" text-anchor="start">Each validation fold gets a turn; the final test remains sealed</text><text x="50" y="167" font-family="system-ui,sans-serif" font-size="13" fill="#547487" font-weight="800" text-anchor="start">Fold 1</text><rect x="135" y="148" width="67" height="25" rx="5" fill="#edae4c" stroke="#d79535"/><rect x="212" y="148" width="67" height="25" rx="5" fill="#5a82d6" stroke="#5a82d6"/><rect x="289" y="148" width="67" height="25" rx="5" fill="#5a82d6" stroke="#5a82d6"/><rect x="366" y="148" width="67" height="25" rx="5" fill="#5a82d6" stroke="#5a82d6"/><rect x="443" y="148" width="67" height="25" rx="5" fill="#5a82d6" stroke="#5a82d6"/><text x="50" y="205" font-family="system-ui,sans-serif" font-size="13" fill="#547487" font-weight="800" text-anchor="start">Fold 2</text><rect x="135" y="186" width="67" height="25" rx="5" fill="#5a82d6" stroke="#5a82d6"/><rect x="212" y="186" width="67" height="25" rx="5" fill="#edae4c" stroke="#d79535"/><rect x="289" y="186" width="67" height="25" rx="5" fill="#5a82d6" stroke