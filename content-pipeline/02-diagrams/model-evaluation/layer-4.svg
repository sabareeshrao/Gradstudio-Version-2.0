<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="me-4-t me-4-d"><title id="me-4-t">Confusion matrix explains precision and recall</title><desc id="me-4-d">Two by two error counts and corresponding positive prediction metrics.</desc><defs><linearGradient id="me-4-wash" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ecf7fa"/></linearGradient></defs><rect x="1" y="1" width="998" height="428" rx="20" fill="url(#me-4-wash)" stroke="#d6e5eb"/><text x="34" y="38" font-family="system-ui,sans-serif" font-size="12" fill="#158c80" font-weight="850" text-anchor="start">GRADSTUDIO     •     MODEL EVALUATION</text><text x="34" y="77" font-family="system-ui,sans-serif" font-size="26" fill="#1d4056" font-weight="820" text-anchor="start">04 · Look at the kind of error, not just accuracy</text><text x="55" y="119" font-family="system-ui,sans-serif" font-size="15" fill="#5b7889" font-weight="650" text-anchor="start">A single accuracy score hides which mistakes occurred</text><rect x="50" y="134" width="480" height="240" rx="12" fill="#fff" stroke="#d6e5eb"/><text x="288" y="161" font-family="system-ui,sans-serif" font-size="13" fill="#3d6ed1" font-weight="820" text-anchor="middle">PREDICTED</text><text x="197" y="184" font-family="system-ui,sans-serif" font-size="13" fill="#45677b" font-weight="750" text-anchor="middle">FIRE</text><text x="423" y="184" font-family="system-ui,sans-serif" font-size="13" fill="#45677b" font-weight="750" text-anchor="middle">SAFE</text><text x="65" y="238" font-family="system-ui,sans-serif" font-size="13" fill="#45677b" font-weight="780" text-anchor="start">FIRE</text><text x="65" y="318" font-family="system-ui,sans-serif" font-size="13" fill="#45677b" font-weight="780" text-anchor="start">SAFE</text><rect x="121" y="198" width="179" height="66" rx="10" fill="#23a18c20" stroke="#23a18c"/><text x="211" y="225" font-family="system-ui,sans-serif" font-size="22" fill="#23a18c" font-weight="850" text-anchor="middle">TP · 18</text><text x="211" y="246" font-family="system-ui,sans-serif" font-size="12" fill="#5d7989" font-weight="620" text-anchor="middle">caught</text><rect x="330" y="198" width="179" height="66" rx="10" fill="#e2786220" stroke="#e27862"/><text x="420" y="225" font-family="system-ui,sans-serif" font-size="22" fill="#e27862" font-weight="850" text-anchor="middle">FN · 2</text><text x="420" y="246" font-family="system-ui,sans-serif" font-size="12" fill="#5d7989" font-weight="620" text-anchor="middle">missed</text><rect x="121" y="276" width="179" height="66" rx="10" fill="#e2786220" stroke="#e27862"/><text x="211" y="303" font-family="system-ui,sans-serif" font-size="22" fill="#e27862" font-weight="850" text-anchor="middle">FP · 7</text><text x="211" y="324" font-family="system-ui,sans-serif" font-size="12" fill="#5d7989" font-weight="620" text-anchor="middle">false alarm</text><rect x="330" y="276" width="179" height="66" rx="10" fill="#23a18c20" stroke="#23a18c"/><text x="420" y="303" font-family="system-ui,sans-serif" font-size="22" fill="#23a18c" font-weight="850" text-anchor="middle">TN · 73</text><text x="420" y="324" font-family="system-ui,sans-serif" font-size="12" fill="#5d7989" font-weight="620" text-anchor="middle">clear</text><rect x="566" y="135" width="385" height="240" rx="12" fill="#fff" stroke="#d6e5eb"/><text x="756" y="166" font-family="system-ui,sans-serif" font-size="14" fill="#3d6ed1" font-weight="820" text-anchor="middle">POSITIVE CLASS</text><circle cx="676" cy="246" r="61" stroke="#e5edf0" stroke-width="18" fill="none"/><circle cx="676" cy="246" r="61" stroke="#eab253" stroke-width="18" fill="none" stroke-dasharray="276 383" transform="rotate(-90 676 246)"/><text x="676" y="252" font-family="system-ui,sans-serif" font-size="23" fill="#25475d" font-weight="800" text-anchor="middle">72%</text><text x="676" y="344" font-family="system-ui,sans-serif" font-size="15" fill="#526f82" font-weight="750" text-anchor="middle">Pre