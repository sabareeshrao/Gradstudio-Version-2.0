<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="me-2-t me-2-d"><title id="me-2-t">Learning curve reveals overfitting</title><desc id="me-2-d">Training error falls steadily while unseen-data error rises after the turning point.</desc><defs><linearGradient id="me-2-wash" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ecf7fa"/></linearGradient></defs><rect x="1" y="1" width="998" height="428" rx="20" fill="url(#me-2-wash)" stroke="#d6e5eb"/><text x="34" y="38" font-family="system-ui,sans-serif" font-size="12" fill="#158c80" font-weight="850" text-anchor="start">GRADSTUDIO     •     MODEL EVALUATION</text><text x="34" y="77" font-family="system-ui,sans-serif" font-size="26" fill="#1d4056" font-weight="820" text-anchor="start">02 · Why training-only evaluation misleads</text><text x="66" y="118" font-family="system-ui,sans-serif" font-size="15" fill="#59798c" font-weight="650" text-anchor="start">Training loss can shrink while unseen-data error increases</text><rect x="78" y="144" width="844" height="235" rx="12" fill="#fff" stroke="#d6e5eb"/><line x1="143" y1="327" x2="871" y2="327" stroke="#34566a" stroke-width="2" stroke-linecap="round" /><line x1="143" y1="177" x2="143" y2="327" stroke="#34566a" stroke-width="2" stroke-linecap="round" /><line x1="143" y1="302" x2="871" y2="302" stroke="#e5edf1" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 6"/><line x1="143" y1="277" x2="871" y2="277" stroke="#e5edf1" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 6"/><line x1="143" y1="252" x2="871" y2="252" stroke="#e5edf1" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 6"/><line x1="143" y1="227" x2="871" y2="227" stroke="#e5edf1" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 6"/><line x1="143" y1="202" x2="871" y2="202" stroke="#e5edf1" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 6"/><text x="88" y="192" font-family="system-ui,sans-serif" font-size="13" fill="#6a8292" font-weight="650" text-anchor="start">Error ↑</text><text x="868" y="352" font-family="system-ui,sans-serif" font-size="13" fill="#6a8292" font-weight="650" text-anchor="end">Training iterations →</text><path d="M150 208 C290 260 377 290 500 301 S751 311 862 314" fill="none" stroke="#2ba88f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 218 C295 260 354 285 474 279 S687 215 862 183" fill="none" stroke="#e97b64" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="483" y1="178" x2="483" y2="326" stroke="#d6a055" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="483" y="164" font-family="system-ui,sans-serif" font-size="13" fill="#bd8333" font-weight="800" text-anchor="middle">overfitting</text><text x="645" y="303" font-family="system-ui,sans-serif" font-size="15" fill="#188774" font-weight="800" text-anchor="start">training</text><text x="725" y="202" font-family="system-ui,sans-serif" font-size="15" fill="#db6d56" font-weight="800" text-anchor="start">unseen data</text></svg>