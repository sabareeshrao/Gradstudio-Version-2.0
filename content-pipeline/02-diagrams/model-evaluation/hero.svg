<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="me-h-t me-h-d"><title id="me-h-t">Evidence from new data, not memory</title><desc id="me-h-d">Held-out prediction bars are compared with actual values; a gauge indicates performance on new cases.</desc><defs><linearGradient id="me-h-wash" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ecf7fa"/></linearGradient></defs><rect x="1" y="1" width="998" height="428" rx="20" fill="url(#me-h-wash)" stroke="#d6e5eb"/><text x="34" y="38" font-family="system-ui,sans-serif" font-size="12" fill="#158c80" font-weight="850" text-anchor="start">GRADSTUDIO     •     MODEL EVALUATION</text><text x="34" y="77" font-family="system-ui,sans-serif" font-size="26" fill="#1d4056" font-weight="820" text-anchor="start">How well does the model work on unseen cases?</text><text x="42" y="116" font-family="system-ui,sans-serif" font-size="15" fill="#59798c" font-weight="650" text-anchor="start">A frozen holdout set produces honest evidence</text><rect x="40" y="135" width="435" height="246" rx="12" fill="#fff" stroke="#d6e5eb"/><text x="66" y="169" font-family="system-ui,sans-serif" font-size="14" fill="#3d6ed1" font-weight="850" text-anchor="start">PREDICTION / REALITY</text><text x="65" y="202" font-family="system-ui,sans-serif" font-size="12" fill="#688095" font-weight="650" text-anchor="start">Case 01</text><rect x="147" y="190" width="215" height="14" rx="7" fill="#e8f1f5" stroke="#d6e5eb"/><rect x="147" y="190" width="180" height="14" rx="7" fill="#4f87dc" stroke="#d6e5eb"/><circle cx="374" cy="197" r="5" fill="#e46b58"/><text x="65" y="231" font-family="system-ui,sans-serif" font-size="12" fill="#688095" font-weight="650" text-anchor="start">Case 02</text><rect x="147" y="219" width="215" height="14" rx="7" fill="#e8f1f5" stroke="#d6e5eb"/><rect x="147" y="219" width="150" height="14" rx="7" fill="#4f87dc" stroke="#d6e5eb"/><circle cx="360" cy="226" r="5" fill="#e46b58"/><text x="65" y="260" font-family="system-ui,sans-serif" font-size="12" fill="#688095" font-weight="650" text-anchor="start">Case 03</text><rect x="147" y="248" width="215" height="14" rx="7" fill="#e8f1f5" stroke="#d6e5eb"/><rect x="147" y="248" width="190" height="14" rx="7" fill="#4f87dc" stroke="#d6e5eb"/><circle cx="369" cy="255" r="5" fill="#e46b58"/><text x="65" y="289" font-family="system-ui,sans-serif" font-size="12" fill="#688095" font-weight="650" text-anchor="start">Case 04</text><rect x="147" y="277" width="215" height="14" rx="7" fill="#e8f1f5" stroke="#d6e5eb"/><rect x="147" y="277" width="118" height="14" rx="7" fill="#ed9472" stroke="#d6e5eb"/><circle cx="385" cy="284" r="5" fill="#e46b58"/><text x="65" y="318" font-family="system-ui,sans-serif" font-size="12" fill="#688095" font-weight="650" text-anchor="start">Case 05</text><rect x="147" y="306" width="215" height="14" rx="7" fill="#e8f1f5" stroke="#d6e5eb"/><rect x="147" y="306" width="169" height="14" rx="7" fill="#4f87dc" stroke="#d6e5eb"/><circle cx="367" cy="313" r="5" fill="#e46b58"/><text x="65" y="347" font-family="system-ui,sans-serif" font-size="12" fill="#688095" font-weight="650" text-anchor="start">Case 06</text><rect x="147" y="335" width="215" height="14" rx="7" fill="#e8f1f5" stroke="#d6e5eb"/><rect x="147" y="335" width="202" height="14" rx="7" fill="#4f87dc" stroke="#d6e5eb"/><circle cx="358" cy="342" r="5" fill="#e46b58"/><text x="270" y="375" font-family="system-ui,sans-serif" font-size="12" fill="#637f92" font-weight="650" text-anchor="middle">Blue: prediction  •  coral: observation</text><path d="M484 250 L530 250" fill="none" stroke="#7394a3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M517 242 L530 250 L517 258" fill="none" stroke="#7394a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="545" y="130" width="415" height="254" rx="12" fill="#fff" stroke="#d6e5eb"/><text x="575" y="163" font-family="system-ui,sans-serif" font-size="14" fill="#3d6ed1" font-weight="850" text-anchor="start">OUT-OF-SAMPLE SCORECARD</text><path d="M618 314 A132 132 0 0 1 885 314" fill="none" stroke="#dce8ee" stroke-width="22" stroke-linecap="round"/><path d="M618 314 A132 132 0 0 1 835 215" fill="none" stroke="#2aa69a" stroke-width="22" stroke-linecap="round"/><path d="M754 310 L829 246" fill="none" stroke="#24485e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="754" cy="310" r="11" fill="#24485e"/><text x="751" y="360" font-family="system-ui,sans-serif" font-size="18" fill="#24485e" font-weight="800" text-anchor="middle">Errors reveal reliability</text></svg>