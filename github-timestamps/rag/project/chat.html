<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Chat</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #171717; color: #ececec; font: 16px/1.6 system-ui, sans-serif; color-scheme: dark; }
main { max-width: 820px; margin: auto; padding: 20px 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 24px; margin: 0; }
#messages { display: grid; gap: 12px; min-height: 180px; margin: 20px 0; }
.message { padding: 12px 16px; border: 1px solid #444; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.user { background: #303030; justify-self: end; max-width: 90%; }
.assistant { background: #212121; }
.source { margin-top: 8px; padding: 8px; border-left: 2px solid #60a5fa; font-size: 14px; }
.warning { color: #fbbf24; font-size: 14px; }
form { display: flex; gap: 8px; align-items: end; }
textarea { flex: 1; min-width: 0; resize: vertical; padding: 12px; border: 1px solid #555; border-radius: 10px; background: #252525; color: inherit; font: inherit; }
button { background: #363636; color: inherit; border: 1px solid #666; border-radius: 8px; padding: 10px 14px; font: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
#status { min-height: 26px; color: #bdbdbd; font-size: 14px; }
</style>
</head>
<body>
<main>
<header><h1>RAG Chat</h1><button id="clear" type="button">Clear</button></header>
<section id="messages" aria-label="Chat messages" aria-live="polite"></section>
<form id="chat-form">
<textarea id="question" aria-label="Question" placeholder="Ask about your documents..." rows="2" maxlength="2000" required></textarea>
<button id="send" type="submit">Send</button>
</form>
<p id="status" role="status">Ready</p>
</main>
<script>
const form = document.getElementById("chat-form");
const question = document.getElementById("question");
const messages = document.getElementById("messages");
const send = document.getElementById("send");
const clear = document.getElementById("clear");
const status = document.getElementById("status");
let busy = false;

function addMessage(role, text) {
    const item = document.createElement("article");
    item.className = "message " + role;
    item.textContent = text;
    messages.append(item);
    return item;
}

function showAnswer(data) {
    const item = addMessage("assistant", data.answer);
    for (const source of data.sources) {
        const detail = document.createElement("div");
        detail.className = "source";
        detail.textContent = source.id + " | " + source.source + "\n" + source.text;
        item.append(detail);
    }
    const note = document.createElement("p");
    note.className = "warning";
    note.textContent = "Citation status: " + data.citation_status;
    if (data.unknown_citations.length) {
        note.textContent += " | Unknown IDs: " + data.unknown_citations.join(", ");
    }
    item.append(note);
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = question.value.trim();
    if (busy || !text || text.length > 2000) return;
    busy = true;
    send.disabled = clear.disabled = question.disabled = true;
    addMessage("user", text);
    question.value = "";
    status.textContent = "Retrieving and generating...";
    try {
        const response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: text })
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        showAnswer(await response.json());
        status.textContent = "Ready";
    } catch (error) {
        addMessage("assistant", "Unable to answer. Please try again.");
        status.textContent = "Request failed";
    } finally {
        busy = false;
        send.disabled = clear.disabled = question.disabled = false;
        question.focus();
    }
});

clear.addEventListener("click", () => {
    if (busy) return;
    messages.replaceChildren();
    question.value = "";
    status.textContent = "Ready";
    question.focus();
});
</script>
</body>
</html>
